name: Generate Contribution Snake

on:
  schedule:
    - cron: "0 0 * * *"

  workflow_dispatch:

  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Generate contribution snake
        uses: Platane/snk/svg-only@v3
        with:
          github_user_name: kooshant
          outputs: |
            dist/github-contribution-grid-snake.svg?color_snake=%23A78BFA&color_dots=%230D0B14%2C%23312E81%2C%234C1D95%2C%236D28D9%2C%23A78BFA
            dist/github-contribution-grid-snake-dark.svg?color_snake=%23C4B5FD&color_dots=%230D0B14%2C%23312E81%2C%234C1D95%2C%236D28D9%2C%23A78BFA

      - name: Publish snake animation
        uses: crazy-max/ghaction-github-pages@v4
        with:
          build_dir: dist
          target_branch: output
          commit_message: Update contribution snake
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
